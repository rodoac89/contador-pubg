name: contador-pubg

services:
  frontend:
    image: {CONTAINER_REGISTRY}
    pull_policy: always
    restart: unless-stopped
    ports:
      - target: 80
        published: "4200"
        protocol: tcp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  backend:
    image: {CONTAINER_REGISTRY}
    pull_policy: always
    restart: unless-stopped
    network_mode: service:frontend
    depends_on:
      - frontend
    environment:
      DJANGO_DEBUG: "False"
      SQLITE_PATH: /data/db.sqlite3
      PUBG_API_KEY: "pubg-api-key-obtained-from-pubg-developer-portal"
    volumes:
      - type: bind
        source: /DATA/AppData/contador-pubg/data
        target: /data
    healthcheck:
      test: ["CMD", "/usr/local/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

x-casaos:
  id: contador-pubg
  main: frontend
  index: /
  port_map: "4200"
  scheme: http
  icon: https://cdn.simpleicons.org/pubg/f2a900
  title:
    en_US: Contador PUBG
    es_ES: Contador PUBG
  tagline:
    en_US: Standings for PUBG custom matches
    es_ES: Tabla de posiciones de partidas custom de PUBG
  description:
    en_US: Public standings table for PUBG custom matches. The backend shares the frontend network and nginx proxies /api to 127.0.0.1:8000.
    es_ES: Tabla pública de posiciones de partidas custom de PUBG. El backend comparte la red del frontend y nginx reenvía /api a 127.0.0.1:8000.
  author: rodoac
  developer: rodoac
  category: Others
  architectures:
    - amd64
  version: "1.0.2"
  update_at: "2026-10-16"
  release_notes:
    en_US: Backend shares the frontend network. Replace this compose and recreate both containers. Restarting only the frontend is not enough.
    es_ES: El backend comparte la red del frontend. Hay que reemplazar este compose y recrear los dos contenedores. No alcanza con reiniciar solo el frontend.
  tips:
    before_install:
      en_US: Paste PUBG_API_KEY in the backend service before installing. Leave the data folder in place on updates so matches are kept. The registry tea.rodoaravena.cl must be logged in on this machine.
      es_ES: Pega PUBG_API_KEY en el servicio backend antes de instalar. No borres la carpeta de datos al actualizar, ahí quedan las partidas. Esta máquina tiene que tener sesión iniciada en tea.rodoaravena.cl.
