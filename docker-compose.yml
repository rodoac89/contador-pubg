services:
  backend:
    image: tea.rodoaravena.cl/rodoac/contador-pubg-backend:latest
    environment:
    # Django Settings
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - SECRET_KEY=your-secret-key-here-change-this-in-production

      #API Key PUBG
      - PUBG_API_KEY=key-goes-here-change-this-in-production
    ports:
      - "8000:8000"
    volumes:
      - ./{APP_DIRECTORY}/backend/db.sqlite3:/app/db.sqlite3
    command: >
      sh -c "python manage.py migrate &&
             exec gunicorn cpoints.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    restart: unless-stopped

  frontend:
    image: ea.rodoaravena.cl/rodoac/contador-pubg-frontend:latest
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
