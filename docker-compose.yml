services:
  backend:
    build:
      context: .
      dockerfile: backend/.dockerfile
    environment:
    # Django Settings
      - DJANGO_DEBUG=False
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - SECRET_KEY=your-secret-key-here-change-this-in-production

      #API Key PUBG
      - PUBG_API_KEY=key-goes-here-change-this-in-production
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             exec gunicorn cpoints.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    restart: unless-stopped
